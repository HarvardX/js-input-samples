<!DOCTYPE html>
<html>

<head>
  <script src="jschannel.js"></script>
  <script src="file_comparison.js" defer></script>
  <style>
    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-style: normal;
      font-size: 1.125rem;
    }

    .drop-area {
      width: 50%;
      height: 150px;

      margin: 20px;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 3px 2px 10px rgba(0, 0, 0, 0.5) inset;
      padding: 15px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drop-area.dragover {
      border-color: #000;
    }
  </style>
</head>

<body>
  <div id="file-drop-area" class="drop-area">
    Drop files here
  </div>
  <div id="info-area"></div>
  <div id="output-area"></div>
</body>

</html>
